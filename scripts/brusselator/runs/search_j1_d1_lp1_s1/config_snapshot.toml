[model]
B = 1.9
A = 1.0
Omega = 10.0

[delta_m_coefficients]
upper_quantile = 0.99
grid_ny = 160
grid_nx = 160
lower_quantile = 0.01
padding_fraction = 0.05

[joint_score]
sampler_progress = false
sampler_use_gpu = true
joint_pdf_bins = 80
max_batches_per_epoch = 64
stein_regularization = 0.0
batch_size = 4096
time_frequencies = [1.0, 2.0, 4.0, 8.0]
learning_rates = [0.001, 0.0005, 0.0002]
tD_override = 1.0
eval_batches_per_lag = 10
lag_sampling_power = 1.0
reset_optimizer_each_stage = true
gpu_id = 1
lag_fractions = [0.1, 0.5, 1.0]
sampler_steps = 120000
sampler_burn_in = 20000
contour_levels = 6
sampler_dt = 0.002
neurons = [256, 256, 256, 128]
epochs_schedule = [24, 36, 48]
learning_rate = 0.00075
verbose = true
mean_regularization = 0.0
noise_scales = [0.2, 0.1, 0.05]
sampler_ensembles = 256
sampler_boundary = 8.0
seed = 2030
sampler_resolution = 20
use_gpu = true

[training]
max_batches_per_epoch = 0
stein_regularization = 0.01
batch_size = 1024
gpu_id = 1
neurons = [128, 128]
epochs_schedule = [60]
learning_rate = 0.00075
verbose = true
mean_regularization = 0.001
noise_scales = [0.05]
seed = 2026
use_gpu = false

[integration]
n_steps = 220000
resolution = 20
burn_in = 20000
progress = true
dt = 0.001
n_ensembles = 256
seed = 2027
use_gpu = true

[data_generation]
burnin_steps = 100000
n_steps_timeseries = 400000
burnin_stationary = 40000
resolution_timeseries = 10
ensemble_stationary = 128
verbose = true
dt = 0.001
seed = 2026
n_steps_stationary = 160000
resolution_stationary = 20

[delta_m_observables]
rbf_padding_fraction = 0.02
rbf_grid_ny = 3
include_quartics = true
rbf_grid_nx = 3
rbf_lower_quantile = 0.05
rbf_upper_quantile = 0.95
include_rbfs = true
rbf_width_scale = 1.0
include_cubics = true

[delta_m_rollout]
burn_in = 20000
dt = 0.001
progress = true
metric_time_horizon = 6.0
evaluation_tD_override = 10.0
grid_ny = 160
resolution = 10
grid_margin_fraction = 0.1
n_ensembles = 192
seed = 2035
grid_nx = 160
n_steps = 220000

[phi_sigma]
use_stein_correction = false
batch_size = 8192
q_min_prob = 0.0002
finite_dt_correction_mode = "per_state"
finite_dt_correction = false
generator_perturb_scale = 0.0
enforce_psd_symmetric = true
perturb_scale_override = -1.0
regularization = 1.0e-6
seed = 2028
use_gpu = false

[run]
name = "search_j1_d1_lp1_s1"
stages = ["joint_score", "observed_residuals", "delta_m", "delta_m_rollout", "delta_m_coefficients"]
force = false

[delta_m]
use_gpu = true
max_batches_per_epoch = 64
batch_size = 4096
smoothness_padding_fraction = 0.04
candidate_mean_delta_ratio_max = 0.25
psd_margin_regularization = 0.05
tD_override = 1.0
magnitude_regularization = 0.001
check_samples = 4096
candidate_coordinate_tolerance_fraction = 0.0
gpu_id = 1
eps_floor = 0.0001
grid_ny = 140
neurons = [256, 256, 256]
eval_pairs_per_lag = 20000
learning_rate = 0.0003
verbose = true
smoothness_upper_quantile = 0.99
mean_regularization = 0.08
lag_step_stride = 1
epochs = 16
grid_margin_fraction = 0.08
psd_margin_floor = 0.02
feature_stat_samples = 40000
smoothness_lower_quantile = 0.01
seed = 2034
candidate_quadratics_improvement_target = 0.1
grid_nx = 140
smoothness_grid_ny = 16
smoothness_grid_nx = 16
base_residual_scales = [0.75, 0.35, 0.75, 0.35]

    [[delta_m.schedule]]
    epochs = 12
    name = "stabilize"
    coordinate_weight = 1.5
    learning_rate = 0.0003
    polynomial_weight = 1.0
    rbf_weight = 0.8
    [[delta_m.schedule]]
    epochs = 16
    name = "balance"
    coordinate_weight = 1.0
    learning_rate = 0.0002
    polynomial_weight = 1.0
    rbf_weight = 1.1
    [[delta_m.schedule]]
    epochs = 12
    name = "quadratic_focus"
    coordinate_weight = 0.8
    learning_rate = 0.0001
    polynomial_weight = 1.2
    rbf_weight = 1.4

    [[delta_m.candidates]]
    name = "rich_smooth"
    anchor_regularization = 0.0015
    smoothness_regularization = 0.01
    residual_scale_factor = 1.0
    [[delta_m.candidates]]
    name = "rich_flexible"
    anchor_regularization = 0.0005
    smoothness_regularization = 0.002
    residual_scale_factor = 1.35

[paths]
diagnostics_h5 = "metrics/diagnostics.h5"
